version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: cypy-web-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
    env_file:
      - .env.example
    volumes:
      - ./storage:/app/backend/storage
    restart: unless-stopped
